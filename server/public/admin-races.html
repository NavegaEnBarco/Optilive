<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Días y pruebas · OptiLive</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#193d50;font:16px system-ui}main{max-width:700px;margin:auto;padding:24px 18px}h1{font-size:28px;margin:0 0 8px}h2{font-size:20px}button,input,select{font:inherit;border-radius:12px;padding:13px;border:1px solid #d7e3eb;min-height:48px}button{background:#087caf;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}select{width:100%;background:white;margin:16px 0}.card,form{background:white;border:1px solid #e0e8ef;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #163e5608}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}label{display:block;font-size:14px;margin:12px 0}label input{display:block;width:100%;margin-top:6px}.badge{font-size:13px;background:#eaf2f8;border-radius:16px;padding:6px 10px;display:inline-block;margin:8px 0 12px}.active{background:#dff4e9;color:#16754e}.muted{color:#607889;font-size:14px}.secondary{background:#edf4f8;color:#1d5875}.danger{background:#fff0ed;color:#a63c31}#message{min-height:24px;color:#a63c31}a{color:#087caf}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #44c6e9}
</style><main><p class="muted">OPTILIVE · ORGANIZACIÓN</p><h1>Días y pruebas</h1><p class="muted">Prepara el programa y el campo de cada salida.</p><select id="regatta" aria-label="Regata"></select><button id="prepare">Preparar días y pruebas</button><p id="message" role="status"></p><div id="list"></div><form id="schedule" hidden><h2>Programa de la regata</h2><div id="days"></div><button type="button" class="secondary" id="addDay">Añadir día</button><p class="muted">Las pruebas se numeran seguidas durante toda la regata.</p><div class="row"><button type="submit">Crear todas las pruebas</button><button type="button" class="secondary" id="cancel">Cancelar</button></div></form></main><script>
const q=new URLSearchParams(location.search);let token=q.get('token')||sessionStorage.getItem('optilive_admin_token')||'',rid=q.get('regatta')||'',races=[];if(token)sessionStorage.setItem('optilive_admin_token',token);q.delete('token');history.replaceState(null,'',location.pathname+'?'+q);
const el=id=>document.getElementById(id);function node(tag,text,cls){const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n}function action(label,fn,cls){const b=node('button',label,cls);b.onclick=()=>Promise.resolve(fn()).catch(e=>el('message').textContent=e.message);return b}
async function api(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined});if(!r.ok){const j=await r.json().catch(()=>({}));const errors={schedule_already_exists:'Ya hay pruebas. El programa existente se conserva.',finish_active_race_first:'Finaliza la prueba en curso antes de iniciar otra.',started_race_locked:'Esta prueba ya ha comenzado.',race_course_locked:'El campo de una prueba iniciada queda guardado.',invalid_days:'Revisa las fechas y el número de pruebas.'};throw Error(r.status===401?'Vuelve al menú de administrador e inicia sesión.':errors[j.error]||'No se pudo guardar ('+r.status+').')}return r.json()}
async function load(){el('message').textContent='Cargando…';races=await api('/api/regattas/'+encodeURIComponent(rid)+'/races');render();el('message').textContent=''}
function render(){el('list').replaceChildren();el('prepare').hidden=races.length>0;let day=null;for(const r of races){if(day!==r.day){day=r.day;el('list').append(node('h2',r.date?new Date(r.date+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}):'Día '+day))}const c=node('div',null,'card');c.append(node('strong','Prueba '+r.number),node('div',r.status,'badge'+(r.status==='En curso'?' active':'')));if(r.plannedTime)c.append(node('p','Salida prevista · '+r.plannedTime,'muted'));c.append(node('p',(r.marks||[]).length+' puntos del recorrido','muted'));const row=node('div',null,'row');const locked=!!r.startedAt||r.status==='Anulada';if(!locked){row.append(action('Configurar campo',()=>{location.href='/admin-course.html?regatta='+encodeURIComponent(rid)+'&day='+r.day+'&number='+r.number}));const sources=races.filter(x=>x.number!==r.number&&(x.marks||[]).length);if(sources.length){const select=node('select');select.setAttribute('aria-label','Copiar campo de otra prueba');select.append(new Option('Copiar campo de…',''));sources.forEach(s=>select.append(new Option('Prueba '+s.number,s.day+':'+s.number)));select.onchange=async()=>{if(!select.value)return;try{if((r.marks||[]).length&&!confirm('¿Sustituir el campo de esta prueba?'))return;const [d,n]=select.value.split(':').map(Number);await api('/api/admin/regattas/'+rid+'/races/'+r.day+'/'+r.number+'/copy-course',{day:d,number:n});await load()}catch(e){el('message').textContent=e.message}};c.append(select)}if(r.status==='Preparada')row.append(action('Iniciar prueba',()=>setStatus(r,'En curso')));row.append(action('Aplazar',()=>setStatus(r,'Aplazada'),'secondary'),action('Anular',()=>setStatus(r,'Anulada'),'danger'))}else if(r.status==='En curso')row.append(action('Finalizar prueba',()=>setStatus(r,'Finalizada')));else c.append(node('p','Campo e historial conservados','muted'));c.append(row);el('list').append(c)}}
async function setStatus(r,status){if(status==='En curso'&&!confirm('¿Confirmar la salida real de la prueba '+r.number+'?'))return;if(status==='Anulada'&&!confirm('¿Anular esta prueba?'))return;await api('/api/admin/regattas/'+rid+'/races',{day:r.day,number:r.number,status});await load()}
function addDay(){const box=node('div',null,'card');for(const [name,label,type,value] of [['date','Fecha','date',''],['count','Pruebas previstas','number','3'],['time','Primera salida prevista (opcional)','time','']]){const l=node('label',label),i=node('input');i.name=name;i.type=type;i.value=value;i.required=name!=='time';if(name==='count'){i.min=1;i.max=20}l.append(i);box.append(l)}const b=action('Quitar día',()=>box.remove(),'secondary');b.type='button';box.append(b);el('days').append(box)}
el('prepare').onclick=()=>{el('schedule').hidden=false;if(!el('days').children.length)addDay()};el('addDay').onclick=addDay;el('cancel').onclick=()=>el('schedule').hidden=true;el('schedule').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;try{const days=[...el('days').children].map(c=>({date:c.querySelector('[name=date]').value,count:Number(c.querySelector('[name=count]').value),time:c.querySelector('[name=time]').value}));await api('/api/admin/regattas/'+rid+'/schedule',{days});el('schedule').hidden=true;await load()}catch(e){el('message').textContent=e.message}finally{button.disabled=false}};
el('regatta').onchange=async()=>{rid=el('regatta').value;el('schedule').hidden=true;try{await load()}catch(e){el('message').textContent=e.message}};
(async()=>{try{const gs=await api('/api/regattas');gs.forEach(g=>el('regatta').append(new Option(g.name,g.id)));if(!gs.length){el('prepare').disabled=true;throw Error('Crea primero una regata desde el menú de administrador.')}if(!gs.some(g=>g.id===rid))rid=gs[gs.length-1].id;el('regatta').value=rid;await load()}catch(e){el('message').textContent=e.message}})();
</script></html>
