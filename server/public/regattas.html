<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regatas · OptiLive</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#f4f7fb;color:#193d50;font:16px system-ui}main{max-width:720px;margin:auto}h1{margin:0;font-size:27px}h2{font-size:21px}h3{font-size:16px;color:#547286}button{font:inherit;min-height:46px;border:0;border-radius:12px;padding:12px;color:white;background:#087caf;cursor:pointer}button:disabled{background:#e8eef3;color:#5c7181;cursor:default}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1;background:#e7eef5;color:#325b74}.tabs [aria-pressed=true]{background:#087caf;color:white}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;border:1px solid #dfe8ef}.muted{color:#607889;font-size:14px}.race{border-top:1px solid #e7eef4;padding:15px 0;display:flex;gap:12px;align-items:center}.race div{flex:1}.race b{display:block;margin-bottom:5px}.live{background:#16845f}.error{color:#ab3f32}#refresh{background:white;color:#087caf;border:1px solid #cbdfea}button:focus-visible{outline:3px solid #45bbdc}</style><main><h1>Regatas</h1><p class="muted">Sigue las pruebas en directo o vuelve a ver las finalizadas.</p><div class="tabs"><button id="finished" aria-pressed="true">Finalizadas</button><button id="all" aria-pressed="false">Todas las pruebas</button></div><button id="refresh">Actualizar</button><p id="status" role="status"></p><div id="list"></div></main><script>
const el=id=>document.getElementById(id);let onlyFinished=new URLSearchParams(location.search).get("view")!=="all",busy=false;
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function dateLabel(r){return r.date?new Date(r.date+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}):'Día '+r.day}
async function get(url){const r=await fetch(url);if(!r.ok)throw Error('No se pudieron cargar las regatas');return r.json()}
async function load(){el("finished").setAttribute("aria-pressed",String(onlyFinished));el("all").setAttribute("aria-pressed",String(!onlyFinished));if(busy)return;busy=true;el('refresh').disabled=true;el('status').textContent='Cargando…';try{const gs=await get('/api/regattas');gs.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));const data=await Promise.all(gs.map(async g=>({g,races:await get('/api/regattas/'+encodeURIComponent(g.id)+'/races')})));const fragment=document.createDocumentFragment();let count=0;
for(const {g,races} of data){const shown=races.filter(r=>!onlyFinished||r.status==='Finalizada').sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||b.day-a.day||a.number-b.number);if(!shown.length)continue;const card=node('section',undefined,'card');card.append(node('h2',g.name),node('p',[g.club,g.venue].filter(Boolean).join(' · '),'muted'));let group='';for(const r of shown){const label=dateLabel(r);if(label!==group){group=label;card.append(node('h3',label))}const row=node('div',undefined,'race'),info=node('div');info.append(node('b','Prueba '+r.number),node('span',r.status,'muted'));if(r.gpsPoints!==undefined)info.append(node('p',r.gpsBoats+' barcos · '+r.gpsPoints+' posiciones GPS','muted'));row.append(info);const b=node('button',r.status==='Finalizada'?'Ver repetición':r.status==='En curso'?'En directo':r.status,r.status==='En curso'?'live':'');b.disabled=!['Finalizada','En curso'].includes(r.status);b.onclick=()=>{location.href='/replay.html?regatta='+encodeURIComponent(g.id)+'&day='+r.day+'&number='+r.number};row.append(b);card.append(row);count++}fragment.append(card)}el('list').replaceChildren(fragment);el('status').textContent=count?'Actualizado · '+new Date().toLocaleTimeString('es-ES'):onlyFinished?'Todavía no hay pruebas finalizadas.':'Todavía no hay pruebas creadas.';el('status').className='muted'}catch(e){el('status').textContent=e.message;el('status').className='error'}finally{busy=false;el('refresh').disabled=false}}
function setTab(value){onlyFinished=value;el('finished').setAttribute('aria-pressed',String(value));el('all').setAttribute('aria-pressed',String(!value));load()}
el('finished').onclick=()=>setTab(true);el('all').onclick=()=>setTab(false);el('refresh').onclick=load;load();setInterval(()=>{if(!document.hidden)load()},30000);
</script></html>
