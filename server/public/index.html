<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OptiLive</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body,#map{height:100%;margin:0;background:#0b3851;font-family:Arial,sans-serif}.leaflet-control-zoom{display:none}.leaflet-control-attribution{font-size:8px;background:#ffffffcc}.leaflet-div-icon{background:none;border:0}.lbl{background:#087fe3;color:#fff;border:2px solid #fff;border-radius:7px;padding:4px 7px;font-weight:800;font-size:12px;box-shadow:0 2px 6px #0006}.opti{position:relative;width:34px;height:48px;filter:drop-shadow(0 2px 2px #0009);transform-origin:17px 38px}.hull{position:absolute;left:8px;bottom:1px;width:18px;height:13px;background:var(--c);border:2px solid #fff;border-radius:48% 48% 60% 60%;box-sizing:border-box}.mast{position:absolute;left:16px;top:3px;width:2px;height:35px;background:#fff}.sail{position:absolute;left:17px;top:3px;width:0;height:0;border-top:30px solid var(--c);border-right:14px solid transparent;filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff)}.sail2{position:absolute;right:17px;top:8px;width:0;height:0;border-bottom:23px solid #f7f7f7;border-left:10px solid transparent;filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff)}.buoy{width:7px;height:7px;border-radius:50%;background:#ff4b3e;border:2px solid #fff;box-shadow:0 2px 4px #0008}.markLabel{background:#07558ad9;color:#fff;border:1px solid #fff;border-radius:5px;padding:2px 5px;font-size:10px;font-weight:700}.finish{font-size:29px;filter:drop-shadow(0 2px 2px #0008)}.finishLabel{color:#fff;font-size:18px;font-weight:800;text-shadow:0 2px 4px #000}.scale{position:absolute;left:18px;bottom:22px;z-index:900;color:#fff;font-weight:700;text-shadow:0 1px 3px #000}.scale:after{content:"";display:block;width:100px;border-bottom:3px solid #fff;border-left:3px solid #fff;border-right:3px solid #fff;height:10px;margin-top:4px}
</style></head><body><div id="map"></div><div class="scale">200 m</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/finish-markers.js"></script><script>
window.map=L.map("map",{zoomControl:false,attributionControl:true}).setView([39.87,4.30],15);L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Leaflet | Esri World Imagery"}).addTo(map);
const markers={},lines={},points={},times={},markMarkers={},colors=["#087fe3","#17a76b","#f28b21","#e83f4c","#9b59d0","#f0d21a","#00a8c8","#ef3e9a"];let activeRegattaId=null,activeRaceKey=null;let first=true,lastLive=null,courseLayer=null;
function boatIcon(c,heading=0){return L.divIcon({className:"",html:'<div style="width:25px;height:42px;transform:rotate('+heading+'deg);transform-origin:12.5px 36.4px;filter:drop-shadow(0 2px 2px #0008)"><svg width="25" height="42" viewBox="0 0 36 60" xmlns="http://www.w3.org/2000/svg"><path d="M18 2 L30 34 L24 52 L12 52 L6 34 Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M18 6 L27 32 L23 47 L18 47 Z" fill="'+c+'" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/><path d="M18 6 L9 32 L13 47 L18 47 Z" fill="'+c+'" fill-opacity=".72" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/><line x1="18" y1="6" x2="18" y2="49" stroke="#fff" stroke-width="2"/><path d="M12 52 L24 52 L27 59 L9 59 Z" fill="'+c+'" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></div>',iconSize:[25,42],iconAnchor:[12.5,41.3]})}
function bearing(a,b){const p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,d=(b[1]-a[1])*Math.PI/180;const y=Math.sin(d)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(d);return(Math.atan2(y,x)*180/Math.PI+360)%360}
function buoyIcon(n){return L.divIcon({className:"",html:'<div class="buoy">'+n+'</div>',iconSize:[28,28],iconAnchor:[14,14]})}
function markIcon(m){if(FinishMarkers.isCommittee(m))return FinishMarkers.committeeIcon();if(FinishMarkers.isFinish(m))return FinishMarkers.icon();return L.divIcon({className:"",html:'<div class="buoy"></div>',iconSize:[11,11],iconAnchor:[5,5]})}
function updateMark(m){if(m.regattaId!==activeRegattaId)return;if(!Number.isFinite(m.lat)||!Number.isFinite(m.lon))return;const ll=[m.lat,m.lon],key=m.regattaId+":"+m.deviceId;if(!markMarkers[key])markMarkers[key]=L.marker(ll,{icon:markIcon(m),zIndexOffset:300}).addTo(map).bindTooltip(m.name,{permanent:true,direction:"right",className:"markLabel",offset:[5,0]});else markMarkers[key].setLatLng(ll);if(first){map.setView(ll,16);first=false}}
async function loadRegattaMarks(){try{const response=await fetch("/api/regattas/current");if(!response.ok)return;const current=await response.json();const id=current.regatta?current.regatta.id:null;const race=current.race,key=race?id+":"+race.day+":"+race.number:null;if(key!==activeRaceKey){activeRaceKey=key;Object.values(markMarkers).forEach(m=>map.removeLayer(m));Object.keys(markMarkers).forEach(k=>delete markMarkers[k]);activeRegattaId=id;first=true}if(!id)return;const ms=await fetch("/api/regattas/"+encodeURIComponent(id)+(race?"/races/"+race.day+"/"+race.number:"")+"/marks").then(r=>r.json());ms.forEach(updateMark)}catch(e){console.log("marks",e)}}

function finishIcon(){return L.divIcon({className:"",html:'<div class="finish">🏁</div><div class="finishLabel">Salida</div>',iconSize:[70,55],iconAnchor:[18,25]})}
function drawCourse(c){if(courseLayer)return;const dLat=.0038,dLon=.0048;const p1=[c[0]-.0014,c[1]-.0037],p2=[c[0]+.0030,c[1]+.0018],p3=[c[0]-.0032,c[1]-.0018],fin=[c[0]-.0009,c[1]+.0038];courseLayer=L.layerGroup().addTo(map);L.polyline([fin,p1,p2,p3,fin],{color:"#fff",weight:3,opacity:.9,dashArray:"9 9"}).addTo(courseLayer);L.marker(p1,{icon:buoyIcon(1)}).addTo(courseLayer);L.marker(p2,{icon:buoyIcon(2)}).addTo(courseLayer);L.marker(p3,{icon:buoyIcon(3)}).addTo(courseLayer);L.marker(fin,{icon:finishIcon()}).addTo(courseLayer)}
let labelsVisible=localStorage.getItem('optilive_live_labels')!=='off';
window.setBoatLabels=enabled=>{labelsVisible=!!enabled;localStorage.setItem('optilive_live_labels',enabled?'on':'off');Object.values(markers).forEach(m=>m.getTooltip()?.setOpacity(enabled?1:0))};
function drawTrail(sail,c){const group=lines[sail];if(!group)return;group.clearLayers();const now=Date.now(),ts=times[sail],ps=points[sail];while(ts.length && now-ts[0]>10000){ts.shift();ps.shift()}for(let i=1;i<ps.length;i++){const age=now-ts[i-1];L.polyline([ps[i-1],ps[i]],{color:c,weight:2,opacity:Math.max(0,.8*(1-age/10000)),lineCap:'round'}).addTo(group)}}
const boatColors={};
function update(p){if(!Number.isFinite(p.lat)||!Number.isFinite(p.lon)||!p.sail)return;const ll=[p.lat,p.lon];const now=Number(p.timestamp)||Date.now();lastLive=ll;if(!points[p.sail])points[p.sail]=[];if(!times[p.sail])times[p.sail]=[];const ps=points[p.sail],ts=times[p.sail];if(ts.length&&now<=ts[ts.length-1])return;const prev=ps.length?ps[ps.length-1]:null;ps.push(ll);ts.push(now);const c=boatColors[p.sail]||(boatColors[p.sail]=colors[Object.keys(boatColors).length%colors.length]);const hdg=prev?bearing(prev,ll):0;if(!markers[p.sail]){const m=L.marker(ll,{icon:boatIcon(c,hdg),zIndexOffset:500}).addTo(map);markers[p.sail]=m;m.bindTooltip(String(p.sail),{permanent:true,direction:'right',className:'lbl',offset:[8,-8],opacity:labelsVisible?1:0});m.getTooltip().setContent(document.createTextNode(String(p.sail)));lines[p.sail]=L.layerGroup().addTo(map)}else{markers[p.sail].setLatLng(ll);if(prev&&Math.abs(prev[0]-ll[0])+Math.abs(prev[1]-ll[1])>0.000001)markers[p.sail].setIcon(boatIcon(c,hdg))}drawTrail(p.sail,c);if(first){map.setView(ll,16);first=false}}
setInterval(()=>Object.keys(lines).forEach(s=>drawTrail(s,boatColors[s])),250);
window.focusLive=()=>{if(lastLive)map.setView(lastLive,16)};
const proto=location.protocol==="https:"?"wss":"ws",ws=new WebSocket(proto+"://"+location.host);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="snapshot"){m.data.forEach(update)}if(m.type==="position")update(m.data);if(m.type==="mark_deleted"){const key=m.data.regattaId+":"+m.data.deviceId;if(markMarkers[key]){map.removeLayer(markMarkers[key]);delete markMarkers[key]}}if(m.type==="mark_position")updateMark(m.data)};loadRegattaMarks();setInterval(loadRegattaMarks,5000);
</script></body></html>
