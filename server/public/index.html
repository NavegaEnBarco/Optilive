<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OptiLive</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body,#map{height:100%;margin:0;background:#0b3851;font-family:Arial,sans-serif}.leaflet-control-zoom{display:none}.leaflet-control-attribution{font-size:8px;background:#ffffffcc}.leaflet-div-icon{background:none;border:0}.lbl{background:#087fe3;color:#fff;border:2px solid #fff;border-radius:7px;padding:6px 10px;font-weight:800;font-size:14px;box-shadow:0 2px 6px #0006}.opti{position:relative;width:34px;height:48px;filter:drop-shadow(0 2px 2px #0009);transform-origin:17px 38px}.hull{position:absolute;left:8px;bottom:1px;width:18px;height:13px;background:var(--c);border:2px solid #fff;border-radius:48% 48% 60% 60%;box-sizing:border-box}.mast{position:absolute;left:16px;top:3px;width:2px;height:35px;background:#fff}.sail{position:absolute;left:17px;top:3px;width:0;height:0;border-top:30px solid var(--c);border-right:14px solid transparent;filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff)}.sail2{position:absolute;right:17px;top:8px;width:0;height:0;border-bottom:23px solid #f7f7f7;border-left:10px solid transparent;filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff)}.buoy{width:7px;height:7px;border-radius:50%;background:#ff4b3e;border:2px solid #fff;box-shadow:0 2px 4px #0008}.markLabel{background:#07558ad9;color:#fff;border:1px solid #fff;border-radius:5px;padding:2px 5px;font-size:10px;font-weight:700}.finish{font-size:29px;filter:drop-shadow(0 2px 2px #0008)}.finishLabel{color:#fff;font-size:18px;font-weight:800;text-shadow:0 2px 4px #000}.scale{position:absolute;left:18px;bottom:22px;z-index:900;color:#fff;font-weight:700;text-shadow:0 1px 3px #000}.scale:after{content:"";display:block;width:100px;border-bottom:3px solid #fff;border-left:3px solid #fff;border-right:3px solid #fff;height:10px;margin-top:4px}
#windToggle{position:absolute;z-index:1200;right:12px;bottom:85px;border:1px solid #b9d9e9;border-radius:15px;padding:12px 15px;background:#075a91;color:white;font:bold 15px system-ui;box-shadow:0 3px 12px #0007}#windToggle.active{background:#fff;color:#075a91}#windInfo{position:absolute;z-index:1200;left:12px;bottom:80px;max-width:210px;padding:10px 12px;background:#082e48e8;color:#fff;border-radius:12px;font:13px system-ui;line-height:1.55;display:none}#windCanvas{position:absolute;inset:0;z-index:405;pointer-events:none;width:100%;height:100%}#windLegend{position:absolute;z-index:1200;left:0;right:0;bottom:0;height:32px;display:none;background:linear-gradient(90deg,#6277b5,#468fc2,#46b7a8,#72bc6d,#d2c958,#e69b52,#b95488);color:white;font:11px system-ui;align-items:center;justify-content:space-around;pointer-events:none}#windInfo strong{font-size:17px}#windInfo small{color:#c6e5f5}</style></head><body><div id="map"></div><div class="scale">200 m</div><canvas id="windCanvas"></canvas><button id="windToggle" type="button" aria-pressed="false">≋ Viento</button><div id="windInfo" role="status"></div><div id="windLegend"><span>kt</span><span>0</span><span>5</span><span>10</span><span>20</span><span>30</span><span>40</span></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/finish-markers.js"></script><script>
window.map=L.map("map",{zoomControl:false,attributionControl:true}).setView([39.87,4.30],15);L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Leaflet | Esri World Imagery"}).addTo(map);
const markers={},lines={},points={},times={},markMarkers={},colors=["#087fe3","#17a76b","#f28b21","#e83f4c","#9b59d0","#f0d21a","#00a8c8","#ef3e9a"];let activeRegattaId=null,activeRaceKey=null;let first=true,lastLive=null,courseLayer=null;
function boatIcon(c,heading=0){return L.divIcon({className:"",html:'<div style="width:25.2px;height:42px;transform:rotate('+heading+'deg);transform-origin:12.6px 36.4px;filter:drop-shadow(0 2px 2px #0008)"><svg width="25.2" height="42" viewBox="0 0 36 60" xmlns="http://www.w3.org/2000/svg"><path d="M18 2 L30 34 L24 52 L12 52 L6 34 Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M18 6 L27 32 L23 47 L18 47 Z" fill="'+c+'" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/><path d="M18 6 L9 32 L13 47 L18 47 Z" fill="'+c+'" fill-opacity=".72" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/><line x1="18" y1="6" x2="18" y2="49" stroke="#fff" stroke-width="2"/><path d="M12 52 L24 52 L27 59 L9 59 Z" fill="'+c+'" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></div>',iconSize:[25.2,42],iconAnchor:[12.6,41.3]})}
function bearing(a,b){const p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,d=(b[1]-a[1])*Math.PI/180;const y=Math.sin(d)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(d);return(Math.atan2(y,x)*180/Math.PI+360)%360}
function buoyIcon(n){return L.divIcon({className:"",html:'<div class="buoy">'+n+'</div>',iconSize:[28,28],iconAnchor:[14,14]})}
function markIcon(m){if(FinishMarkers.isCommittee(m))return FinishMarkers.committeeIcon();if(FinishMarkers.isFinish(m))return FinishMarkers.icon();return L.divIcon({className:"",html:'<div class="buoy"></div>',iconSize:[11,11],iconAnchor:[5,5]})}
function updateMark(m){if(m.regattaId!==activeRegattaId)return;if(!Number.isFinite(m.lat)||!Number.isFinite(m.lon))return;const ll=[m.lat,m.lon],key=m.regattaId+":"+m.deviceId;if(!markMarkers[key])markMarkers[key]=L.marker(ll,{icon:markIcon(m),zIndexOffset:300}).addTo(map).bindTooltip(m.name,{permanent:true,direction:"right",className:"markLabel",offset:[5,0]});else markMarkers[key].setLatLng(ll);if(first){map.setView(ll,16);first=false}}
async function loadRegattaMarks(){try{const response=await fetch("/api/regattas/current");if(!response.ok)return;const current=await response.json();const id=current.regatta?current.regatta.id:null;const race=current.race,key=race?id+":"+race.day+":"+race.number:null;if(key!==activeRaceKey){activeRaceKey=key;Object.values(markMarkers).forEach(m=>map.removeLayer(m));Object.keys(markMarkers).forEach(k=>delete markMarkers[k]);activeRegattaId=id;first=true}if(!id)return;const ms=await fetch("/api/regattas/"+encodeURIComponent(id)+(race?"/races/"+race.day+"/"+race.number:"")+"/marks").then(r=>r.json());ms.forEach(updateMark)}catch(e){console.log("marks",e)}}

function finishIcon(){return L.divIcon({className:"",html:'<div class="finish">🏁</div><div class="finishLabel">Salida</div>',iconSize:[70,55],iconAnchor:[18,25]})}
function drawCourse(c){if(courseLayer)return;const dLat=.0038,dLon=.0048;const p1=[c[0]-.0014,c[1]-.0037],p2=[c[0]+.0030,c[1]+.0018],p3=[c[0]-.0032,c[1]-.0018],fin=[c[0]-.0009,c[1]+.0038];courseLayer=L.layerGroup().addTo(map);L.polyline([fin,p1,p2,p3,fin],{color:"#fff",weight:3,opacity:.9,dashArray:"9 9"}).addTo(courseLayer);L.marker(p1,{icon:buoyIcon(1)}).addTo(courseLayer);L.marker(p2,{icon:buoyIcon(2)}).addTo(courseLayer);L.marker(p3,{icon:buoyIcon(3)}).addTo(courseLayer);L.marker(fin,{icon:finishIcon()}).addTo(courseLayer)}
function update(p){const ll=[p.lat,p.lon],now=Number.isFinite(p.timestamp)?p.timestamp:Date.now();lastLive=ll;if(!points[p.sail])points[p.sail]=[];if(!times[p.sail])times[p.sail]=[];const prev=points[p.sail].length?points[p.sail][points[p.sail].length-1]:null;points[p.sail].push(ll);times[p.sail].push(now);while(times[p.sail].length>2&&now-times[p.sail][0]>5000){times[p.sail].shift();points[p.sail].shift()}const i=Object.keys(markers).indexOf(p.sail),c=colors[(i<0?Object.keys(markers).length:i)%colors.length],hdg=prev?bearing(prev,ll):0;if(!markers[p.sail]){markers[p.sail]=L.marker(ll,{icon:boatIcon(c,hdg),zIndexOffset:500}).addTo(map).bindTooltip((p.sail.startsWith("ESP")?p.sail:"ESP "+p.sail),{permanent:true,direction:"right",className:"lbl",offset:[13,-5]});lines[p.sail]=L.layerGroup().addTo(map)}else{markers[p.sail].setLatLng(ll);if(prev&&Math.abs(prev[0]-ll[0])+Math.abs(prev[1]-ll[1])>0.000001)markers[p.sail].setIcon(boatIcon(c,hdg))}lines[p.sail].clearLayers();const trail=points[p.sail];for(let j=1;j<trail.length;j++){const age=(j)/(trail.length-1||1),op=.05+.82*age,w=1.4+2.2*age;L.polyline([trail[j-1],trail[j]],{color:c,weight:w,opacity:op,smoothFactor:2,lineCap:"round",lineJoin:"round"}).addTo(lines[p.sail])}if(first){map.setView(ll,16);first=false}}
window.focusLive=()=>{if(lastLive)map.setView(lastLive,16)};
const proto=location.protocol==="https:"?"wss":"ws",ws=new WebSocket(proto+"://"+location.host);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="snapshot"){if(m.tracks)Object.entries(m.tracks).forEach(([s,t])=>points[s]=t.slice(0,-1));m.data.forEach(update)}if(m.type==="position")update(m.data);if(m.type==="mark_deleted"){const key=m.data.regattaId+":"+m.data.deviceId;if(markMarkers[key]){map.removeLayer(markMarkers[key]);delete markMarkers[key]}}if(m.type==="mark_position")updateMark(m.data)};loadRegattaMarks();setInterval(loadRegattaMarks,5000);

const windCanvas=document.getElementById('windCanvas'),windCtx=windCanvas.getContext('2d'),windButton=document.getElementById('windToggle'),windInfo=document.getElementById('windInfo');let windOn=false,windSamples=[],windFrame=0,windLastFetch=0,windRequestId=0;
function windColor(kn){return kn<5?'#4eb6e4':kn<10?'#35d2b5':kn<16?'#b3e75e':kn<23?'#ffd453':kn<30?'#ff9043':'#ee5365'}
function windCompass(d){return ['N','NE','E','SE','S','SO','O','NO'][Math.round(d/45)%8]}
function resizeWind(){const r=windCanvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);windCanvas.width=Math.round(r.width*d);windCanvas.height=Math.round(r.height*d);windCtx.setTransform(d,0,0,d,0,0)}
let windParticles=[],windLastFrame=0,windHeatmap=null;
function windField(x,y){if(!windSamples.length)return null;const ll=map.containerPointToLatLng([x,y]);let sum=0,k=0,sin=0,cos=0;for(const v of windSamples){const dx=(ll.lng-v.lon)*Math.cos(ll.lat*Math.PI/180),dy=ll.lat-v.lat;const weight=1/Math.pow(dx*dx+dy*dy+1e-8,.75);sum+=weight;k+=weight*v.kn;sin+=weight*Math.sin(v.dir*Math.PI/180);cos+=weight*Math.cos(v.dir*Math.PI/180)}return {kn:k/sum,dir:(Math.atan2(sin,cos)*180/Math.PI+360)%360}}
function rebuildWindHeatmap(){const w=windCanvas.clientWidth,h=windCanvas.clientHeight;if(!w||!h||!windSamples.length)return;const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w/12));c.height=Math.max(1,Math.ceil(h/12));const ctx=c.getContext('2d'),pixels=ctx.createImageData(c.width,c.height);for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){const v=windField((x+.5)*w/c.width,(y+.5)*h/c.height);const k=v?v.kn:0;const stops=[[0,94,113,177],[5,66,142,189],[10,69,177,172],[16,115,185,109],[23,210,198,88],[30,231,155,82],[40,179,82,135]];let i=0;while(i<stops.length-2&&k>stops[i+1][0])i++;const lo=stops[i],hi=stops[i+1],t=Math.max(0,Math.min(1,(k-lo[0])/(hi[0]-lo[0]))),o=(y*c.width+x)*4;for(let j=0;j<3;j++)pixels.data[o+j]=lo[j+1]+(hi[j+1]-lo[j+1])*t;pixels.data[o+3]=145}ctx.putImageData(pixels,0,0);windHeatmap=c}
function seedWindParticles(){const w=windCanvas.clientWidth,h=windCanvas.clientHeight;windParticles=Array.from({length:Math.min(1100,Math.max(300,Math.round(w*h/460)))},()=>({x:Math.random()*w,y:Math.random()*h,age:Math.random()*130,max:75+Math.random()*100}))}
function drawWind(t){if(!windOn)return;const w=windCanvas.clientWidth,h=windCanvas.clientHeight,dt=Math.min(2.5,Math.max(.3,(t-(windLastFrame||t))/16.67));windLastFrame=t;windCtx.clearRect(0,0,w,h);if(windHeatmap){windCtx.imageSmoothingEnabled=true;windCtx.drawImage(windHeatmap,0,0,w,h)}windCtx.lineWidth=.85;windCtx.strokeStyle='rgba(242,252,255,.73)';windCtx.lineCap='round';for(const p of windParticles){const v=windField(p.x,p.y);if(!v)continue;const a=(v.dir+180)*Math.PI/180,speed=(.35+Math.min(v.kn,35)*.055)*dt,dx=Math.sin(a)*speed,dy=-Math.cos(a)*speed;windCtx.globalAlpha=.25+.55*Math.sin(Math.PI*Math.min(1,p.age/p.max));windCtx.beginPath();windCtx.moveTo(p.x,p.y);windCtx.lineTo(p.x+dx*4.5,p.y+dy*4.5);windCtx.stroke();p.x+=dx;p.y+=dy;p.age+=dt;if(p.x<0||p.y<0||p.x>w||p.y>h||p.age>p.max){p.x=Math.random()*w;p.y=Math.random()*h;p.age=0;p.max=75+Math.random()*100}}windCtx.globalAlpha=1;windFrame=requestAnimationFrame(drawWind)}
async function fetchWind(){if(!windOn)return;const request=++windRequestId,center=map.getCenter(),bounds=map.getBounds(),lats=[],lons=[];for(let y=0;y<4;y++)for(let x=0;x<4;x++){lats.push((bounds.getSouth()+(y+.5)/4*(bounds.getNorth()-bounds.getSouth())).toFixed(5));lons.push((bounds.getWest()+(x+.5)/4*(bounds.getEast()-bounds.getWest())).toFixed(5))}
windInfo.textContent='Consultando viento previsto…';try{const url='https://api.open-meteo.com/v1/forecast?latitude='+lats.join(',')+'&longitude='+lons.join(',')+'&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=kn&timezone=UTC';const response=await fetch(url);if(!response.ok)throw Error('meteorología');const data=await response.json();if(!windOn||request!==windRequestId)return;const items=Array.isArray(data)?data:[data];windSamples=items.map((a,i)=>({lat:Number(lats[i]),lon:Number(lons[i]),kn:Number(a.current?.wind_speed_10m)||0,dir:Number(a.current?.wind_direction_10m)||0,gust:Number(a.current?.wind_gusts_10m)||0}));const best=windSamples.reduce((a,b)=>Math.hypot(a.lat-center.lat,a.lon-center.lng)<Math.hypot(b.lat-center.lat,b.lon-center.lng)?a:b);windInfo.innerHTML='<strong>≋ '+best.kn.toFixed(1)+' kn</strong> · '+windCompass(best.dir)+' ('+Math.round(best.dir)+'°)<div>Rachas: '+best.gust.toFixed(1)+' kn</div><small>Modelo Open-Meteo · 10 m · no medición en directo</small>';windLastFetch=Date.now();rebuildWindHeatmap();seedWindParticles()}catch(e){if(request===windRequestId)windInfo.textContent='Viento no disponible · comprueba la conexión'}}
windButton.onclick=()=>{windOn=!windOn;windButton.classList.toggle('active',windOn);windButton.setAttribute('aria-pressed',String(windOn));windInfo.style.display=windOn?'block':'none';document.getElementById('windLegend').style.display=windOn?'flex':'none';if(windOn){resizeWind();seedWindParticles();fetchWind();windLastFrame=0;windFrame=requestAnimationFrame(drawWind)}else{windRequestId++;cancelAnimationFrame(windFrame);windCtx.clearRect(0,0,windCanvas.width,windCanvas.height)}};map.on('moveend',()=>{if(windOn)fetchWind()});window.addEventListener('resize',()=>{resizeWind();rebuildWindHeatmap();seedWindParticles()});setInterval(()=>{if(windOn&&Date.now()-windLastFetch>600000)fetchWind()},60000);
</script></body></html>
