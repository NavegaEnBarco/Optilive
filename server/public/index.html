<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OptiLive · Live</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>html,body,#map{height:100%;margin:0}#panel{position:absolute;z-index:1000;top:12px;left:12px;background:white;padding:10px 14px;border-radius:10px;box-shadow:0 2px 12px #0003;font:14px sans-serif}b{font-size:18px}</style></head>
<body><div id="panel"><b>OptiLive</b><br><span id="status">Conectando…</span></div><div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map("map").setView([39.99,4.18],11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const markers={}; let first=true;
function update(p){let m=markers[p.sail];const ll=[p.lat,p.lon];if(!m){m=markers[p.sail]=L.marker(ll).addTo(map)}else m.setLatLng(ll);m.bindPopup("<b>"+p.sail+"</b><br>Precisión: "+(p.accuracy??"-")+" m");if(first){map.setView(ll,15);first=false}}
const proto=location.protocol==="https:"?"wss":"ws"; const ws=new WebSocket(proto+"://"+location.host);
ws.onopen=()=>status.textContent="En directo";
ws.onclose=()=>status.textContent="Desconectado";
ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="snapshot")m.data.forEach(update);if(m.type==="position")update(m.data)};
</script></body></html>
