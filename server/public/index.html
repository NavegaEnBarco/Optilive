<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OptiLive</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body,#map{height:100%;margin:0;background:#0b3851;font-family:Arial,sans-serif}.leaflet-control-zoom{display:none}.leaflet-control-attribution{font-size:8px;background:#ffffffcc}.leaflet-div-icon{background:none;border:0}.lbl{background:#087fe3;color:#fff;border:2px solid #fff;border-radius:7px;padding:6px 10px;font-weight:800;font-size:14px;box-shadow:0 2px 6px #0006}.opti{position:relative;width:32px;height:44px;filter:drop-shadow(0 2px 2px #0009)}.hull{position:absolute;bottom:1px;left:4px;width:24px;height:9px;background:#fff;border:1px solid #405261;border-radius:55% 55% 45% 45%}.mast{position:absolute;left:15px;top:2px;width:2px;height:33px;background:#f8fbff}.sail{position:absolute;left:16px;top:3px;width:0;height:0;border-top:28px solid var(--c);border-right:13px solid transparent}.sail2{position:absolute;right:16px;top:8px;width:0;height:0;border-bottom:21px solid #f7f7f7;border-left:10px solid transparent}.buoy{width:28px;height:28px;border-radius:50%;background:#ff4438;border:2px solid #fff;color:#fff;font:800 14px Arial;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px #0007}.finish{font-size:29px;filter:drop-shadow(0 2px 2px #0008)}.finishLabel{color:#fff;font-size:18px;font-weight:800;text-shadow:0 2px 4px #000}.scale{position:absolute;left:18px;bottom:22px;z-index:900;color:#fff;font-weight:700;text-shadow:0 1px 3px #000}.scale:after{content:"";display:block;width:100px;border-bottom:3px solid #fff;border-left:3px solid #fff;border-right:3px solid #fff;height:10px;margin-top:4px}
</style></head><body><div id="map"></div><div class="scale">200 m</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
window.map=L.map("map",{zoomControl:false,attributionControl:true}).setView([39.87,4.30],15);L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Leaflet | Esri World Imagery"}).addTo(map);
const markers={},lines={},points={},colors=["#087fe3","#17a76b","#f28b21","#e83f4c","#9b59d0","#f0d21a","#00a8c8","#ef3e9a"];let first=true,lastLive=null,courseLayer=null;
function boatIcon(c){return L.divIcon({className:"",html:'<div class="opti" style="--c:'+c+'"><i class="mast"></i><i class="sail"></i><i class="sail2"></i><i class="hull"></i></div>',iconSize:[32,44],iconAnchor:[16,34]})}
function buoyIcon(n){return L.divIcon({className:"",html:'<div class="buoy">'+n+'</div>',iconSize:[28,28],iconAnchor:[14,14]})}
function finishIcon(){return L.divIcon({className:"",html:'<div class="finish">🏁</div><div class="finishLabel">Salida</div>',iconSize:[70,55],iconAnchor:[18,25]})}
function drawCourse(c){if(courseLayer)return;const dLat=.0038,dLon=.0048;const p1=[c[0]-.0014,c[1]-.0037],p2=[c[0]+.0030,c[1]+.0018],p3=[c[0]-.0032,c[1]-.0018],fin=[c[0]-.0009,c[1]+.0038];courseLayer=L.layerGroup().addTo(map);L.polyline([fin,p1,p2,p3,fin],{color:"#fff",weight:3,opacity:.9,dashArray:"9 9"}).addTo(courseLayer);L.marker(p1,{icon:buoyIcon(1)}).addTo(courseLayer);L.marker(p2,{icon:buoyIcon(2)}).addTo(courseLayer);L.marker(p3,{icon:buoyIcon(3)}).addTo(courseLayer);L.marker(fin,{icon:finishIcon()}).addTo(courseLayer)}
function update(p){const ll=[p.lat,p.lon];lastLive=ll;if(!points[p.sail])points[p.sail]=[];points[p.sail].push(ll);if(points[p.sail].length>1500)points[p.sail].shift();const i=Object.keys(markers).indexOf(p.sail),c=colors[(i<0?Object.keys(markers).length:i)%colors.length];if(!markers[p.sail]){markers[p.sail]=L.marker(ll,{icon:boatIcon(c),zIndexOffset:500}).addTo(map).bindTooltip((p.sail.startsWith("ESP")?p.sail:"ESP "+p.sail),{permanent:true,direction:"right",className:"lbl",offset:[13,-5]});lines[p.sail]=L.polyline(points[p.sail],{color:c,weight:3,opacity:.95,smoothFactor:2}).addTo(map)}else{markers[p.sail].setLatLng(ll);lines[p.sail].setLatLngs(points[p.sail])}if(first){drawCourse(ll);map.setView(ll,16);first=false}}
window.focusLive=()=>{if(lastLive)map.setView(lastLive,16)};
const proto=location.protocol==="https:"?"wss":"ws",ws=new WebSocket(proto+"://"+location.host);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="snapshot"){if(m.tracks)Object.entries(m.tracks).forEach(([s,t])=>points[s]=t.slice(0,-1));m.data.forEach(update)}if(m.type==="position")update(m.data)};
</script></body></html>
