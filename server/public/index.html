<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OptiLive · Regata en directo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body,#map{height:100%;margin:0;font-family:Arial,sans-serif}#top{position:absolute;z-index:1000;top:16px;left:16px;background:#fff;padding:14px 18px;border-radius:16px;box-shadow:0 5px 22px #0003;min-width:220px}.brand{font-size:25px;font-weight:800;color:#07558a}.live{color:#0a9b68;font-weight:700}.boat{background:#087fe3;color:#fff;border:3px solid #fff;border-radius:50% 50% 50% 0;width:30px;height:30px;transform:rotate(-45deg);box-shadow:0 2px 8px #0005}.boat span{display:block;transform:rotate(45deg);font-size:17px;text-align:center;line-height:27px}.leaflet-div-icon{background:none;border:0}.label{background:#087fe3;color:#fff;padding:5px 9px;border-radius:6px;font-weight:700;white-space:nowrap}.stats{font-size:13px;color:#526777;margin-top:6px}
</style></head><body><div id="top"><div class="brand">⛵ OptiLive</div><div><span id="state">Conectando…</span> · <span id="count">0 barcos</span></div><div class="stats" id="last">Esperando posiciones</div></div><div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map("map").setView([39.99,4.18],11);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const markers={},lines={},points={};let first=true;
function icon(){return L.divIcon({className:"",html:'<div class="boat"><span>▲</span></div>',iconSize:[34,34],iconAnchor:[17,27]})}
function update(p){const ll=[p.lat,p.lon];if(!points[p.sail])points[p.sail]=[];points[p.sail].push(ll);if(points[p.sail].length>1500)points[p.sail].shift();
 if(!markers[p.sail]){markers[p.sail]=L.marker(ll,{icon:icon()}).addTo(map).bindTooltip(p.sail,{permanent:true,direction:"right",className:"label",offset:[16,0]});lines[p.sail]=L.polyline(points[p.sail],{weight:4,opacity:.75}).addTo(map)}else{markers[p.sail].setLatLng(ll);lines[p.sail].setLatLngs(points[p.sail])}
 markers[p.sail].bindPopup("<b>"+p.sail+"</b><br>Precisión: "+(p.accuracy??"-")+" m<br>Velocidad: "+(p.speedKnots??"-")+" kn");last.textContent="Última posición: "+p.sail+" · "+new Date(p.receivedAt).toLocaleTimeString();count.textContent=Object.keys(markers).length+" barco(s)";if(first){map.setView(ll,17);first=false}}
const proto=location.protocol==="https:"?"wss":"ws",ws=new WebSocket(proto+"://"+location.host);ws.onopen=()=>{state.textContent="● EN DIRECTO";state.className="live"};ws.onclose=()=>{state.textContent="Desconectado";state.className=""};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="snapshot"){if(m.tracks)Object.entries(m.tracks).forEach(([s,t])=>points[s]=t.slice(0,-1));m.data.forEach(update)}if(m.type==="position")update(m.data)};
</script></body></html>
