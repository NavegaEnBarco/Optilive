<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OptiLive</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body,#map{height:100%;margin:0;background:#0b3851;font-family:Arial,sans-serif}.leaflet-control-zoom{display:none}.leaflet-control-attribution{font-size:8px}.leaflet-div-icon{background:none;border:0}.lbl{background:#087fe3;color:#fff;border:1px solid #fff;border-radius:6px;padding:6px 10px;font-weight:800;font-size:14px;box-shadow:0 2px 5px #0005}.opti{position:relative;width:28px;height:39px;filter:drop-shadow(0 2px 2px #0009)}.hull{position:absolute;bottom:0;left:5px;width:18px;height:8px;background:#fff;border:1px solid #405261;border-radius:50%}.mast{position:absolute;left:13px;top:2px;width:2px;height:29px;background:#fff}.sail{position:absolute;left:14px;top:3px;width:0;height:0;border-top:24px solid var(--c);border-right:11px solid transparent}.sail2{position:absolute;right:13px;top:8px;width:0;height:0;border-bottom:19px solid #f7f7f7;border-left:8px solid transparent}
</style></head><body><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
window.map=L.map("map",{zoomControl:false}).setView([39.87,4.30],15);L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Esri World Imagery"}).addTo(map);
const markers={},lines={},points={},colors=["#087fe3","#17a76b","#f28b21","#e83f4c","#9b59d0","#f0d21a","#00a8c8","#ef3e9a"];let first=true,lastLive=null;
function boatIcon(c){return L.divIcon({className:"",html:'<div class="opti" style="--c:'+c+'"><i class="mast"></i><i class="sail"></i><i class="sail2"></i><i class="hull"></i></div>',iconSize:[30,40],iconAnchor:[15,31]})}
function update(p){const ll=[p.lat,p.lon];lastLive=ll;if(!points[p.sail])points[p.sail]=[];points[p.sail].push(ll);if(points[p.sail].length>1500)points[p.sail].shift();const i=Object.keys(markers).indexOf(p.sail),c=colors[(i<0?Object.keys(markers).length:i)%colors.length];
 if(!markers[p.sail]){markers[p.sail]=L.marker(ll,{icon:boatIcon(c)}).addTo(map).bindTooltip(p.sail,{permanent:true,direction:"right",className:"lbl",offset:[12,-5]});lines[p.sail]=L.polyline(points[p.sail],{color:c,weight:3,opacity:.9,smoothFactor:2}).addTo(map)}else{markers[p.sail].setLatLng(ll);lines[p.sail].setLatLngs(points[p.sail])}
 if(first){map.setView(ll,17);first=false}}
window.focusLive=()=>{if(lastLive)map.setView(lastLive,17)};
const proto=location.protocol==="https:"?"wss":"ws",ws=new WebSocket(proto+"://"+location.host);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="snapshot"){if(m.tracks)Object.entries(m.tracks).forEach(([s,t])=>points[s]=t.slice(0,-1));m.data.forEach(update)}if(m.type==="position")update(m.data)};
</script></body></html>
