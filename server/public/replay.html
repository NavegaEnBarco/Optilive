<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repetición · OptiLive</title><link rel="stylesheet" href="/vendor/leaflet/leaflet.css"><style>*{box-sizing:border-box}html,body{height:100%;margin:0;font:15px system-ui;color:#193d50;background:#f4f7fb}body{display:flex;flex-direction:column}header{padding:12px 16px;background:white;border-bottom:1px solid #dfe8ef}header a{color:#087caf;font-weight:600;text-decoration:none}h1{font-size:19px;margin:8px 0 2px}#map{flex:1;min-height:220px;background:#123b4c}footer{padding:14px 16px max(14px,env(safe-area-inset-bottom));background:white}button,select,input{font:inherit}button,select{min-height:44px;border-radius:10px;padding:10px;border:1px solid #d5e2ec;background:white;color:#193d50}button{cursor:pointer}#play{background:#087caf;color:white;border:0}button:disabled,input:disabled{opacity:.45}#seek{width:100%;margin:14px 0 6px;accent-color:#087caf}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row select{flex:1}.time{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:13px;color:#607889}#status{font-size:13px;color:#607889;margin:7px 0}#follow{accent-color:#087caf}.boat{width:20px;height:20px;border:2px solid white;border-radius:50%;box-shadow:0 2px 6px #0007}.boat.selected{border:3px solid #ffe55c;width:25px;height:25px}.leaflet-tooltip{font-size:11px}#search{width:100%;border:1px solid #d5e2ec;border-radius:10px;padding:10px;min-height:42px;margin-top:8px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #41bade}</style>
<header><a href="/regattas.html">‹ Regatas</a><h1 id="title">Cargando prueba…</h1><div id="status" role="status">Obteniendo posiciones GPS…</div></header><div id="map"></div><footer><div class="row"><button id="restart" disabled aria-label="Volver al inicio">↺ Inicio</button><button id="play" disabled>▶ Reproducir</button><select id="speed" aria-label="Velocidad de reproducción"><option value="1">×1</option><option value="2">×2</option><option value="5">×5</option><option value="10">×10</option></select><button id="refresh">Actualizar</button></div><input id="seek" aria-label="Tiempo de la prueba" type="range" min="0" max="1000" value="0" disabled><div class="time"><span id="clock">00:00:00</span><span id="total">00:00:00</span></div><input id="search" type="search" placeholder="Buscar número de vela" aria-label="Buscar número de vela"><div class="row" style="margin-top:8px"><select id="boat" aria-label="Destacar regatista"><option value="">Todos los barcos</option></select><label><input type="checkbox" id="follow"> Seguir</label></div></footer>
<script src="/vendor/leaflet/leaflet.js"></script><script src="/replay-engine.js"></script><script>
const el=id=>document.getElementById(id),q=new URLSearchParams(location.search),rid=q.get('regatta'),base='/api/regattas/'+encodeURIComponent(rid)+'/races/'+encodeURIComponent(q.get('day'))+'/'+encodeURIComponent(q.get('number'))+'/tracks';const map=L.map('map').setView([39.87,4.3],14);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'}).addTo(map);const course=L.layerGroup().addTo(map),colors=['#087fe3','#17a76b','#f28b21','#e83f4c','#9b59d0','#edbf19','#00a8c8'];let tracks={},markers={},lines={},start=0,end=0,time=0,playing=false,last=0,live=false,loading=false,initialized=false,selected='';
function duration(ms){let s=Math.floor(Math.max(0,ms)/1000);return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')}
function icon(s,i){return L.divIcon({className:'',html:'<div class="boat'+(s===selected?' selected':'')+'" style="background:'+colors[i%colors.length]+'"></div>',iconSize:[25,25],iconAnchor:[12,12]})}
function render(){Object.entries(tracks).forEach(([s,t],i)=>{const p=ReplayEngine.position(t,time);if(!p){if(markers[s])markers[s].remove();if(lines[s])lines[s].setLatLngs([]);return}const ll=[p.lat,p.lon];if(!markers[s]){const label=document.createElement('span');label.textContent=s;markers[s]=L.marker(ll).bindTooltip(label,{permanent:true});lines[s]=L.polyline([],{color:colors[i%colors.length],weight:3}).addTo(map)}markers[s].setIcon(icon(s,i)).setLatLng(ll).addTo(map);markers[s].setZIndexOffset(s===selected?1000:0);lines[s].setStyle({opacity:selected&&s!==selected?.2:.8,weight:s===selected?5:3});lines[s].setLatLngs(t.slice(0,p.index).map(p=>[p.lat,p.lon]).concat([ll]));if(s===selected&&el('follow').checked)map.panTo(ll,{animate:false})});el('seek').value=end>start?Math.round((time-start)/(end-start)*1000):0;el('clock').textContent=duration(time-start);el('total').textContent=duration(end-start)}
function updateBoats(){const filter=el('search').value.trim().toUpperCase();el('boat').replaceChildren(new Option('Todos los barcos',''));Object.keys(tracks).filter(s=>s.toUpperCase().includes(filter)).sort().forEach(s=>el('boat').append(new Option(s,s)));if([...el('boat').options].some(o=>o.value===selected))el('boat').value=selected;else{selected='';el('boat').value=''}if(filter&&el('boat').options.length===2){selected=el('boat').options[1].value;el('boat').value=selected}}
async function load(initial=false){if(loading)return;loading=true;el('refresh').disabled=true;try{const r=await fetch(base);if(!r.ok)throw Error('No se pudo cargar esta prueba ('+r.status+')');const d=await r.json();tracks=ReplayEngine.normalize(d.tracks);live=d.race.status==='En curso';el('title').textContent=(live?'En directo':'Repetición')+' · Prueba '+d.race.number+(d.race.date?' · '+new Date(d.race.date+'T12:00:00').toLocaleDateString('es-ES'):' · Día '+d.race.day);course.clearLayers();const bounds=[];for(const m of d.marks||[]){if(Number.isFinite(m.lat)&&Number.isFinite(m.lon)){const label=document.createElement('span');label.textContent=m.name;L.circleMarker([m.lat,m.lon],{color:'#ff6c22',fillOpacity:1,radius:5}).addTo(course).bindTooltip(label,{permanent:true});bounds.push([m.lat,m.lon])}}if(bounds.length>1)L.polyline(bounds,{color:'#fff',weight:2,dashArray:'6 6'}).addTo(course);const range=ReplayEngine.range(tracks,d.race);updateBoats();if(!range){playing=false;el('play').disabled=true;el('restart').disabled=true;el('seek').disabled=true;el('status').textContent='Aún no hay posiciones GPS guardadas. Pulsa Actualizar para comprobar si han llegado.';if(bounds.length&&initial)map.fitBounds(bounds,{padding:[25,25],maxZoom:17});return}start=range.start;end=range.end;if(!initialized){time=live?end:start;for(const t of Object.values(tracks))for(const p of t)bounds.push([p.lat,p.lon]);if(bounds.length)map.fitBounds(bounds,{padding:[25,25],maxZoom:17});initialized=true}else time=live&&!playing?end:Math.max(start,Math.min(end,time));el('play').disabled=false;el('restart').disabled=false;el('seek').disabled=false;el('status').textContent=Object.keys(tracks).length+' barcos · '+Object.values(tracks).reduce((n,t)=>n+t.length,0)+' posiciones GPS · '+(live?'En directo':'Datos recibidos hasta '+new Date().toLocaleTimeString('es-ES'));render()}catch(e){el('status').textContent=e.message}finally{loading=false;el('refresh').disabled=false}}
el('play').onclick=()=>{if(time>=end)time=start;playing=!playing;el('play').textContent=playing?'⏸ Pausar':'▶ Reproducir';last=performance.now();render()};el('restart').onclick=()=>{playing=false;time=start;el('play').textContent='▶ Reproducir';render()};el('seek').oninput=()=>{time=start+(end-start)*Number(el('seek').value)/1000;render()};el('boat').onchange=()=>{selected=el('boat').value;render()};el('search').oninput=()=>{updateBoats();render()};el('follow').onchange=render;el('refresh').onclick=()=>load();function tick(now){if(playing){time=Math.min(end,time+(now-last)*Number(el('speed').value));render();if(time>=end){playing=false;el('play').textContent='▶ Reproducir'}}last=now;requestAnimationFrame(tick)}load(true);setInterval(()=>{if(!document.hidden)load()},15000);requestAnimationFrame(tick);
</script></html>
