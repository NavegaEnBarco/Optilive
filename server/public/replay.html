<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OptiLive Replay</title><link rel="stylesheet" href="/vendor/leaflet/leaflet.css"><style>body{margin:0;font:15px Arial;color:#17364a}#map{height:75vh}footer{padding:12px}button,select{padding:8px}input{width:100%}#status{padding:8px}.boat{background:#087fe3;color:white;border-radius:8px;padding:4px;white-space:nowrap}</style><div id="map"></div><footer><div id="status">Cargando tracks…</div><button id="play" disabled>▶ Reproducir</button> <select id="speed"><option value="1">1×</option><option value="5">5×</option><option value="20">20×</option><option value="60">60×</option></select><input id="seek" type="range" min="0" max="1000" value="0" disabled><span id="clock"></span></footer><script src="/vendor/leaflet/leaflet.js"></script><script>
const q=new URLSearchParams(location.search),base='/api/regattas/'+encodeURIComponent(q.get('regatta'))+'/races/'+encodeURIComponent(q.get('day'))+'/'+encodeURIComponent(q.get('number'))+'/tracks';
const map=L.map('map').setView([39.87,4.3],14);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'}).addTo(map);
const statusEl=document.getElementById('status'),play=document.getElementById('play'),seek=document.getElementById('seek'),clock=document.getElementById('clock'),speed=document.getElementById('speed');let tracks={},markers={},lines={},start=0,end=0,time=0,playing=false,last=0,live=false;const colors=['#087fe3','#17a76b','#f28b21','#e83f4c','#9b59d0'];
function render(){Object.entries(tracks).forEach(([s,t],i)=>{let lo=0,hi=t.length;while(lo<hi){const m=(lo+hi)>>1;if(t[m].timestamp<=time)lo=m+1;else hi=m}if(!lo){if(markers[s])markers[s].remove();if(lines[s])lines[s].setLatLngs([]);return}const a=t[lo-1],b=t[lo],f=b?Math.max(0,Math.min(1,(time-a.timestamp)/(b.timestamp-a.timestamp))):0,ll=[a.lat+(b?b.lat-a.lat:0)*f,a.lon+(b?b.lon-a.lon:0)*f];if(!markers[s]){const label=document.createElement('span');label.textContent=s;markers[s]=L.marker(ll).bindTooltip(label,{permanent:true});lines[s]=L.polyline([],{color:colors[i%colors.length],weight:3}).addTo(map)}markers[s].setLatLng(ll).addTo(map);lines[s].setLatLngs(t.slice(0,lo).map(p=>[p.lat,p.lon]).concat([ll]))});seek.value=end>start?Math.round((time-start)/(end-start)*1000):0;clock.textContent=new Date(time).toLocaleTimeString()}
async function load(initial){try{const r=await fetch(base);if(!r.ok)throw Error('No se pudo cargar esta prueba');const d=await r.json();tracks=d.tracks;let bounds=[],min=Infinity,max=-Infinity;for(const t of Object.values(tracks))for(const p of t){min=Math.min(min,p.timestamp);max=Math.max(max,p.timestamp);bounds.push([p.lat,p.lon])}live=d.race.status==='En curso';if(!bounds.length){statusEl.textContent=live?'En directo: esperando posiciones GPS':'Esta prueba no tiene tracks GPS guardados';return}start=min;end=max;if(initial||!time){time=live?end:start;map.fitBounds(bounds,{padding:[25,25],maxZoom:17});(d.marks||[]).forEach(m=>{if(Number.isFinite(m.lat)&&Number.isFinite(m.lon)){const label=document.createElement('span');label.textContent=m.name;L.circleMarker([m.lat,m.lon],{color:'#ff6c22'}).addTo(map).bindTooltip(label)}})}else if(live&&!playing)time=end;statusEl.textContent=(live?'EN DIRECTO':'REPLAY')+' · Prueba '+d.race.number+' · '+Object.keys(tracks).length+' barcos';play.disabled=false;seek.disabled=false;render()}catch(e){statusEl.textContent=e.message}}
play.onclick=()=>{if(time>=end)time=start;playing=!playing;play.textContent=playing?'⏸ Pausar':'▶ Reproducir';last=performance.now()};seek.oninput=()=>{time=start+(end-start)*Number(seek.value)/1000;render()};function tick(now){if(playing){time=Math.min(end,time+(now-last)*Number(speed.value));render();if(time>=end){playing=false;play.textContent='▶ Reproducir'}}last=now;requestAnimationFrame(tick)}load(true);setInterval(()=>{if(live)load(false)},3000);requestAnimationFrame(tick);
</script></html>
