<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clasificación · OptiLive</title><style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#f4f7fa;color:#172433;font:14px system-ui}.card{background:white;border-radius:18px;box-shadow:0 3px 14px #16334b10;border:1px solid #edf1f4}.race{padding:16px;display:flex;align-items:center;gap:10px;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}.race .info{flex:1;min-width:0}.title{font-size:18px;font-weight:800;margin-bottom:4px}.sub{color:#6a7887;font-size:12px}.badge{font-size:10px;font-weight:800;border-radius:12px;padding:6px 8px;background:#e9eef3;color:#567085;white-space:nowrap}.badge.live{color:#087f5b;background:#e3f6ec}.tabs{display:flex;border:0;gap:3px;background:#e9eef3;border-radius:12px;padding:4px;margin:12px 0}.tabs button{flex:1;font-size:11px;background:none;color:#637286;border:0;padding:11px 2px;border-radius:9px;cursor:pointer}.tabs [aria-pressed=true]{background:white;color:#087fe3;font-weight:800}.search{width:100%;border:1px solid #edf1f4;border-radius:14px;padding:14px;background:white;font:inherit;margin-bottom:12px}.caption{font-size:12px;color:#6a7887;margin:6px 2px 10px}.head,.row{display:grid;grid-template-columns:30px minmax(0,1fr) 48px 44px;gap:6px;align-items:center}.head{padding:12px;color:#7a8795;font-size:10px}.row{padding:14px 12px;border-top:1px solid #edf1f4;min-height:86px}.sail{font-weight:800;font-size:13px;overflow-wrap:anywhere}.name{font-size:12px;margin-top:3px}.meta{font-size:11px;color:#788695;margin-top:3px}.gap{text-align:right;font-size:11px}.pos{font-weight:800;text-align:center}.gps{font-size:10px;text-align:center;color:#079561}.gps.stale{color:#a06c00}.gps.off{color:#788695}.signal{display:flex;align-items:flex-end;gap:2px;justify-content:center;height:18px;margin-bottom:4px}.signal i{width:3px;background:currentColor;border-radius:2px}.signal i:nth-child(1){height:5px}.signal i:nth-child(2){height:9px}.signal i:nth-child(3){height:13px}.signal i:nth-child(4){height:17px}.empty{padding:28px 18px;text-align:center;color:#748292;line-height:1.6}.note{color:#788695;font-size:11px;line-height:1.5;text-align:center;margin:14px 8px}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button.action,a.action{background:white;border:1px solid #087fe3;border-radius:12px;color:#087fe3;padding:12px 16px;font:700 13px system-ui;text-decoration:none;cursor:pointer}a.primary{background:#087fe3;color:white}#status{font-size:11px;color:#788695;text-align:center;margin:12px 0}dialog{border:0;border-radius:18px;max-width:calc(100% - 32px);width:360px;color:#193d50;padding:20px}dialog::backdrop{background:#10273888}dialog select{width:100%;padding:12px;margin:8px 0 14px;border:1px solid #dfe8ef;border-radius:10px;font:inherit}label{font-size:13px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #42b9df} [hidden]{display:none!important}
</style></head><body>
<button class="card race" id="chooseTop" aria-label="Seleccionar regata y prueba"><div class="info"><div class="title" id="raceTitle">Cargando regatas…</div><div class="sub" id="raceDetail"></div></div><span class="badge" id="raceState">EN ESPERA</span><span aria-hidden="true">⌄</span></button>
<div class="tabs" aria-label="Categoría"><button data-category="" aria-pressed="true">GENERAL</button><button data-category="Sub11" aria-pressed="false">SUB 11</button><button data-category="Sub13" aria-pressed="false">SUB 13</button><button data-category="Sub15" aria-pressed="false">SUB 15</button></div>
<input class="search" id="search" placeholder="Buscar vela o regatista" aria-label="Buscar vela o regatista" type="search">
<div class="caption" id="caption">Clasificación GPS · pendiente de cálculo</div><section class="card" aria-label="Barcos de la prueba"><div class="head"><b>POS.</b><b>REGATISTA</b><b>DIF.</b><b>GPS</b></div><div id="rows"><div class="empty">Cargando…</div></div></section>
<p class="note" id="note">Las posiciones y diferencias se mostrarán cuando el recorrido permita calcularlas. No es una clasificación oficial.</p>
<div class="actions"><button class="action" id="choose">Elegir otra prueba</button><a class="action primary" id="replay" hidden>Ver repetición</a></div><p id="status" role="status"></p>
<dialog id="picker"><h3>Seleccionar prueba</h3><label for="regatta">Regata</label><select id="regatta"></select><label for="race">Día y prueba</label><select id="race"></select><div class="actions"><button class="action" id="cancel">Cancelar</button><button class="action" id="confirm">Ver prueba</button></div></dialog>
<script src="/classification-model.js"></script><script src="/classification.js"></script></body></html>
