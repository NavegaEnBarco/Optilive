<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Montar campo · OptiLive</title><link rel="stylesheet" href="/vendor/leaflet/leaflet.css"><style>
html,body,#map{height:100%;margin:0;font-family:Arial}#map{background:#0b3851}.top{position:fixed;z-index:1000;left:12px;right:12px;top:12px;background:#fff;border-radius:14px;padding:10px;box-shadow:0 3px 12px #0005}.title{font-weight:800;color:#07558a}.hint{font-size:13px;color:#52677a;margin-top:4px}.bottom{position:fixed;z-index:1000;left:10px;right:10px;bottom:12px;background:#fff;border-radius:14px;padding:9px;box-shadow:0 3px 12px #0006}.row{display:flex;gap:6px;overflow-x:auto}.row button,.done{border:0;border-radius:9px;padding:10px 12px;background:#087fe3;color:white;font-weight:800;white-space:nowrap}.row button.active{background:#07558a;outline:3px solid #7ec8ff}.done{width:100%;margin-top:8px;background:#0b8f5a}.buoy{width:12px;height:12px;border-radius:50%;background:#ff4b3e;border:2px solid white;box-shadow:0 2px 4px #0008}.label{background:#07558ad9;color:#fff;border:1px solid #fff;border-radius:5px;padding:2px 5px;font-size:10px;font-weight:700}.leaflet-control-attribution{font-size:8px}</style></head><body>
<div id="map"></div><div class="top"><div class="title">Montar campo · <span id="count">0</span> boyas</div><div class="hint" id="hint">Pulsa Comité y toca el mapa</div></div>
<div class="bottom"><div class="row" id="buttons"></div><button class="done" onclick="finish()">✓ TERMINAR CAMPO</button></div>
<script src="/vendor/leaflet/leaflet.js"></script><script>
const q=new URLSearchParams(location.search),rid=q.get('regatta')||'',token=q.get('token')||'';
const sequence=[['Comité','Salida babor'],['Visor','Salida estribor'],['Barlovento','Barlovento'],['Offset','Offset'],['Sotavento 1','Sotavento babor'],['Sotavento 2','Sotavento estribor'],['Llegada','Llegada']];
let step=0,data=[],courseLine=null,busy=false;const layer=L.layerGroup();
const map=L.map('map',{zoomControl:true}).setView([39.87,4.30],14);layer.addTo(map);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(map);
function icon(){return L.divIcon({className:'',html:'<div class="buoy"></div>',iconSize:[16,16],iconAnchor:[8,8]})}
function buttons(){const b=document.getElementById('buttons');b.innerHTML='';sequence.forEach((x,i)=>{const e=document.createElement('button');e.textContent=(i<step?'✓ ':'')+x[0];if(i===step)e.className='active';e.onclick=()=>{step=i;buttons();hint.textContent='Toca el mapa para colocar '+x[0]};b.appendChild(e)})}
async function add(p){if(busy)return;if(!rid){alert('No hay regata activa. Vuelve a Administración y selecciona/crea una regata.');return}busy=true;const x=sequence[step],body={name:x[0],type:x[1],lat:p.lat,lon:p.lng};hint.textContent='Guardando '+x[0]+'…';const r=await fetch('/api/admin/regattas/'+encodeURIComponent(rid)+'/marks',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)});if(!r.ok){busy=false;alert('No se pudo guardar ('+r.status+'). Comprueba la regata activa.');return}if(step<sequence.length-1)step++;await load(false);buttons();hint.textContent=step<sequence.length?'Ahora toca el mapa para '+sequence[step][0]:'Campo completo ✓';busy=false}
map.on('click',e=>add(e.latlng));document.getElementById('map').addEventListener('contextmenu',e=>e.preventDefault());
async function load(fit=true){layer.clearLayers();if(courseLine){map.removeLayer(courseLine);courseLine=null}if(!rid)return;try{data=await fetch('/api/regattas/'+encodeURIComponent(rid)+'/marks').then(r=>r.json())}catch(e){return}const pts=[];data.forEach(m=>{if(Number.isFinite(m.lat)&&Number.isFinite(m.lon)){const mk=L.marker([m.lat,m.lon],{icon:icon(),draggable:true}).addTo(layer).bindTooltip(m.name,{permanent:true,direction:'right',className:'label',offset:[6,0]});mk.on('dragend',()=>alert('Para cambiar esta boya, vuelve a colocarla con su botón.'));pts.push([m.lat,m.lon])}});count.textContent=pts.length;if(pts.length>1)courseLine=L.polyline(pts,{color:'#fff',weight:2,opacity:.9,dashArray:'7 7'}).addTo(map);if(fit&&pts.length>1)map.fitBounds(pts,{padding:[70,70]})}
function finish(){hint.textContent='Campo guardado ✓';alert('Campo de regatas guardado')}
buttons();load().then(()=>{if(data.length===0){step=0;buttons();hint.textContent='Pulsa Comité y toca el mapa'}else{step=Math.min(data.length,sequence.length-1);buttons();hint.textContent='Continúa con '+sequence[step][0]}});
</script></body></html>
