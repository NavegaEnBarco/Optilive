<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Montar campo · OptiLive</title><link rel="stylesheet" href="/vendor/leaflet/leaflet.css"><style>
*{box-sizing:border-box}html,body,#map{height:100%;margin:0;font-family:system-ui,-apple-system,Roboto,Arial,sans-serif}#map{background:#092c3a}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;transition:background .16s,transform .16s,box-shadow .16s}button:active:not(:disabled){transform:scale(.98)}button:focus-visible,input:focus-visible{outline:3px solid #38bdf8;outline-offset:3px}button:disabled{opacity:.42;cursor:default}.head{position:fixed;z-index:1000;left:14px;right:14px;top:14px;background:#ffffffef;border:1px solid #ffffff8a;border-radius:18px;padding:16px 18px;box-shadow:0 8px 28px #00172530;backdrop-filter:blur(16px)}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:800;color:#168fa4;margin-bottom:5px}.title{font-size:20px;font-weight:750;letter-spacing:-.5px;color:#12374a;display:flex;align-items:center;justify-content:space-between;gap:8px}#progress{font-size:11px;letter-spacing:0;background:#e5f4f6;color:#167286;border:1px solid #c9e7ec;padding:6px 9px;border-radius:20px;white-space:nowrap}.sub{font-size:12px;color:#6b7f8c;margin-top:6px}.panel{position:fixed;z-index:1000;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));background:#fff;border:1px solid #e1eaf0;border-radius:22px;padding:16px;box-shadow:0 12px 40px #00152255}.handle{width:30px;height:3px;background:#d8e3ea;border-radius:3px;margin:0 auto 12px}.current{font-size:14px;line-height:1.5;font-weight:650;color:#193d50;margin-bottom:12px;min-height:21px}.primary,.secondary,.done,.tools button{display:flex;align-items:center;justify-content:center;gap:9px;min-height:48px;border-radius:12px;font-size:14px;font-weight:650}.primary,.secondary,.done{width:100%;padding:12px;border:1px solid transparent}.primary{background:linear-gradient(135deg,#1179ba,#086598);color:#fff;box-shadow:0 4px 12px #0879ad24}.secondary{background:#f2f7fa;border-color:#dae7ed;color:#23546d;margin-top:8px}.secondary.armed{background:#e1f4f8;border-color:#299ab0;color:#086779}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.tools button{padding:10px 6px;background:white;border:1px solid #dce7ed;color:#36596d;font-size:13px}.tools .danger{color:#b74343;background:#fff7f7;border-color:#f2dede}.done{background:#ecf8f2;border-color:#cbe8d8;color:#14754e;margin-top:12px}.ico{width:19px;height:19px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.buoy{width:9px;height:9px;border-radius:50%;background:#ff6559;border:2px solid white;box-shadow:0 2px 5px #0008}.label{background:#11455ddd;color:#fff;border:1px solid #ffffff80;border-radius:7px;padding:4px 7px;font-size:11px;font-weight:700}form button{min-height:44px;padding:10px 15px;border:1px solid #dce7ed;border-radius:10px;background:#f3f7fa;color:#33596d;font-weight:650}form button[type=submit]{background:#086eaa;color:white;border-color:#086eaa}form input{border:1px solid #d5e2ea;border-radius:10px;color:#193d50;background:#f8fafc}form h3{color:#193d50;letter-spacing:-.3px}form label{font-size:13px;font-weight:600;color:#527080}.message{color:#b74343;font-size:13px}.leaflet-control-zoom{margin-top:118px!important;box-shadow:0 3px 12px #00172530!important}.leaflet-control-attribution{font-size:8px!important}@media(max-height:620px){.head{top:8px;padding:10px 14px}.eyebrow{display:none}.panel{padding:10px;bottom:8px}.handle{display:none}.current{margin-bottom:6px}.primary,.secondary,.done,.tools button{min-height:42px;padding:8px}.tools,.done{margin-top:8px}}
</style></head><body>
<div id="map"></div><div class="head"><div class="eyebrow">OPTILIVE · CAMPO DE REGATA</div><div class="title">Montar campo <span id="progress">0/7</span></div><div class="sub" id="regatta">Buscando regata activa…</div></div>
<div class="panel"><div class="handle"></div><div class="current" id="current">Punto actual: SALIDA (S)</div><button class="primary" onclick="placeHere()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg><span>Colocar con mi GPS</span></button><button class="secondary" id="mapMode" onclick="armMap()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Zm6-2v16m6-14v16"/></svg><span id="mapLabel">Colocar en el mapa</span></button><div class="tools"><button id="deleteMark" onclick="removeSelected()" disabled class="danger"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg>Eliminar boya</button><button onclick="editCoords()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/><circle cx="12" cy="12" r="7"/><path d="m9 12 2 2 4-4"/></svg>Coordenadas</button></div><button class="done" onclick="finish()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>Terminar campo</button></div>
<script src="/vendor/leaflet/leaflet.js"></script><script>
const q=new URLSearchParams(location.search);let rid=q.get('regatta')||'';let token=sessionStorage.getItem('optilive_admin_token')||q.get('token')||'';
function renewSession(){return new Promise((resolve,reject)=>{const overlay=document.createElement('div');overlay.style.cssText='position:fixed;inset:0;background:#0009;z-index:2000;display:flex;align-items:center;justify-content:center';overlay.innerHTML='<form style="background:white;padding:20px;border-radius:14px;width:85%;max-width:360px"><h3>Vuelve a iniciar sesión</h3><p>La sesión de administrador ha caducado.</p><input name="username" autocomplete="username" placeholder="Usuario" required style="width:100%;box-sizing:border-box;padding:12px"><input name="password" type="password" autocomplete="current-password" placeholder="Contraseña" required style="width:100%;box-sizing:border-box;padding:12px;margin-top:8px"><p class="message" role="alert"></p><button type="submit">Conectar y continuar</button> <button type="button">Cancelar</button></form>';document.body.appendChild(overlay);const form=overlay.querySelector('form');form.querySelector('[type=button]').onclick=()=>{overlay.remove();reject(Error('Operación cancelada'))};form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('[type=submit]');button.disabled=true;try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.elements.username.value,password:form.elements.password.value})});if(!r.ok)throw Error(r.status===401?'Usuario o contraseña incorrectos':'No se pudo iniciar sesión');token=(await r.json()).token;sessionStorage.setItem('optilive_admin_token',token);form.elements.password.value='';overlay.remove();resolve()}catch(e){form.querySelector('.message').textContent=e.message;button.disabled=false}}})}
async function adminFetch(url,options){const send=()=>fetch(url,{...options,headers:{...options.headers,'Authorization':'Bearer '+token}});let r=await send();if(r.status===401){await renewSession();r=await send()}return r}
const seq=[['S','Salida'],['S','Salida'],['2','Boya 2'],['3','Boya 3'],['4','Boya 4'],['L','Llegada'],['L','Llegada']];
let step=0,data=[],armed=false,busy=false,line=null,selected=null;const layer=L.layerGroup();const map=L.map('map',{zoomControl:true}).setView([39.87,4.30],14);layer.addTo(map);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(map);
function icon(){return L.divIcon({className:'',html:'<div class="buoy"></div>',iconSize:[11,11],iconAnchor:[5,5]})}
async function init(){if(!rid){const rs=await fetch('/api/regattas').then(r=>r.json()).catch(()=>[]);if(rs.length)rid=rs[rs.length-1].id}if(!rid){regatta.textContent='No hay regatas creadas';current.textContent='Crea primero una regata';return}const rs=await fetch('/api/regattas').then(r=>r.json()).catch(()=>[]),r=rs.find(x=>x.id===rid);regatta.textContent=(r?r.name:'Regata')+' · ID '+rid;await load(true);step=Math.min(data.length,seq.length-1);ui()}
function ui(){progress.textContent=data.length+' puntos';current.textContent='Punto actual: '+(seq[step]?seq[step][1].toUpperCase():'AÑADIR PUNTO');document.getElementById('deleteMark').disabled=!selected||busy;document.getElementById('mapLabel').textContent=armed?'Toca el mapa para colocar':'Colocar en el mapa';mapMode.classList.toggle('armed',armed)}
function armMap(){armed=true;ui()}
map.on('click',e=>{if(armed){armed=false;savePoint(e.latlng.lat,e.latlng.lng)}});
function placeHere(){if(!navigator.geolocation){alert('GPS no disponible');return}current.textContent='Obteniendo GPS…';navigator.geolocation.getCurrentPosition(p=>savePoint(p.coords.latitude,p.coords.longitude),e=>{ui();alert('No se pudo obtener la posición GPS. Comprueba el permiso de ubicación.')},{enableHighAccuracy:true,timeout:12000,maximumAge:2000})}
async function savePoint(lat,lon){if(busy||!rid)return;busy=true;const x=seq[step]||seq[seq.length-1];current.textContent='Guardando '+x[0]+'…';const r=await adminFetch('/api/admin/regattas/'+encodeURIComponent(rid)+'/marks',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({name:x[0],type:x[1],lat,lon})});if(!r.ok){busy=false;ui();alert('No se pudo guardar ('+r.status+')');return}await load(false);step=Math.min(data.length,seq.length-1);busy=false;ui()}
async function load(fit){layer.clearLayers();if(line){map.removeLayer(line);line=null}data=await fetch('/api/regattas/'+encodeURIComponent(rid)+'/marks').then(r=>r.json()).catch(()=>[]);selected=selected?data.find(m=>m.deviceId===selected.deviceId)||null:null;document.getElementById('deleteMark').disabled=!selected||busy;const pts=[];data.forEach(m=>{if(Number.isFinite(m.lat)&&Number.isFinite(m.lon)){const mk=L.marker([m.lat,m.lon],{icon:icon(),draggable:true}).addTo(layer).bindTooltip(m.name,{permanent:true,direction:'right',className:'label',offset:[5,0]});mk.on('click',()=>{selected=m;ui();current.textContent='Seleccionada: '+m.name+' · arrástrala para moverla'});mk.on('dragstart',()=>{selected=m;ui();current.textContent='Moviendo '+m.name+'…'});mk.on('dragend',e=>moveMark(m,e.target.getLatLng()));pts.push([m.lat,m.lon])}});if(pts.length>1)line=L.polyline(pts,{color:'#fff',weight:2,dashArray:'6 6'}).addTo(map);if(fit&&pts.length)map.setView(pts[pts.length-1],16)}
async function moveMark(m,ll){if(busy)return;busy=true;const r=await adminFetch('/api/admin/regattas/'+encodeURIComponent(rid)+'/marks/'+encodeURIComponent(m.deviceId),{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({lat:ll.lat,lon:ll.lng})});busy=false;if(!r.ok){alert('No se pudo mover la boya ('+r.status+')');await load(false);return}await load(false);ui();current.textContent='Boya '+m.name+' movida ✓'}
function editCoords(){if(busy)return;const m=selected;const overlay=document.createElement('div');overlay.style.cssText='position:fixed;inset:0;background:#0009;z-index:2000;display:flex;align-items:center;justify-content:center';overlay.innerHTML='<form style="background:white;padding:20px;border-radius:14px;width:85%;max-width:360px"><h3></h3><label>Latitud (°)<input name="lat" inputmode="decimal" required style="display:block;width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px"></label><label>Longitud (°)<input name="lon" inputmode="decimal" required style="display:block;width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px"></label><p class="message" role="alert"></p><button type="submit">Guardar</button> <button type="button">Cancelar</button></form>';document.body.appendChild(overlay);const form=overlay.querySelector('form');form.querySelector('h3').textContent=m?'Coordenadas · Boya '+m.name:'Coordenadas · Nuevo punto '+seq[step][0];form.elements.lat.value=m&&Number.isFinite(m.lat)?String(m.lat):'';form.elements.lon.value=m&&Number.isFinite(m.lon)?String(m.lon):'';form.querySelector('[type=button]').onclick=()=>overlay.remove();form.onsubmit=async e=>{e.preventDefault();const la=form.elements.lat.value.trim(),lo=form.elements.lon.value.trim(),a=Number(la.replace(',','.')),b=Number(lo.replace(',','.'));if(!la||!lo||!Number.isFinite(a)||!Number.isFinite(b)||Math.abs(a)>90||Math.abs(b)>180){form.querySelector('.message').textContent='Introduce una latitud entre −90 y 90 y una longitud entre −180 y 180.';return}overlay.remove();try{if(m)await moveMark(m,{lat:a,lng:b});else await savePoint(a,b)}catch(e){busy=false;ui();alert(e.message||'No se pudieron guardar las coordenadas')}}}

async function removeSelected(){if(busy||!selected)return;const m=selected;if(!confirm('¿Eliminar la boya '+m.name+' seleccionada?'))return;busy=true;armed=false;ui();try{const r=await adminFetch('/api/admin/regattas/'+encodeURIComponent(rid)+'/marks/'+encodeURIComponent(m.deviceId),{method:'DELETE',headers:{'Authorization':'Bearer '+token}});if(!r.ok)throw Error('No se pudo eliminar la boya ('+r.status+')');selected=null;await load(false);step=Math.min(data.length,seq.length-1);busy=false;ui();current.textContent='Boya '+m.name+' eliminada ✓'}catch(e){busy=false;ui();alert(e.message)}}
function finish(){if(!data.length){alert('Todavía no has colocado ninguna boya');return}alert('Campo guardado con '+data.length+' puntos ✓')}
init();
</script></body></html>
