<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor campo OptiLive</title><link rel="stylesheet" href="/vendor/leaflet/leaflet.css"><style>html,body,#map{height:100%;margin:0;font-family:Arial}#map{background:#0b3851}.bar{position:fixed;z-index:1000;left:10px;right:10px;top:10px;background:#fff;border-radius:14px;padding:9px;box-shadow:0 3px 12px #0005}.row{display:flex;gap:6px;overflow:auto}.bar button{border:0;border-radius:9px;padding:10px;background:#087fe3;color:#fff;font-weight:700;white-space:nowrap}.hint{font-size:12px;color:#456;margin-top:7px}.edit{position:fixed;z-index:1100;left:10px;right:10px;bottom:12px;background:#fff;border-radius:14px;padding:12px;box-shadow:0 3px 15px #0007;display:none}.edit input{box-sizing:border-box;width:100%;padding:10px;margin:4px 0;border:1px solid #ccd6df;border-radius:8px}.edit .half{width:49%}.edit button{padding:10px;border:0;border-radius:8px;background:#087fe3;color:#fff;font-weight:700}.buoy{width:27px;height:27px;border-radius:50%;background:#ff4b3e;border:3px solid white;box-shadow:0 2px 5px #0008}</style></head><body><div id="map"></div><div class="bar"><div class="row"><button onclick="choose('Salida babor')">Salida</button><button onclick="choose('Barlovento')">Barlovento</button><button onclick="choose('Offset')">Offset</button><button onclick="choose('Sotavento')">Sotavento</button><button onclick="choose('Llegada')">Llegada</button></div><div class="hint" id="hint">Elige una boya y toca el mapa para colocarla</div></div><div class="edit" id="edit"><b id="kind"></b><input id="name" placeholder="Nombre de la boya"><div><input class="half" id="lat" placeholder="Latitud" inputmode="decimal"><input class="half" id="lon" placeholder="Longitud" inputmode="decimal"></div><input id="gps" placeholder="ID GPS (opcional)"><button onclick="save()">GUARDAR BOYA</button> <button onclick="closeEdit()">Cancelar</button></div><script src="/vendor/leaflet/leaflet.js"></script><script>
const q=new URLSearchParams(location.search),rid=q.get('regatta')||'',token=q.get('token')||'';const map=L.map('map',{zoomControl:true}).setView([39.87,4.30],14);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(map);let type='',draft=null;const marks=L.layerGroup().addTo(map);function icon(){return L.divIcon({className:'',html:'<div class="buoy"></div>',iconSize:[33,33],iconAnchor:[16,16]})}function choose(t){type=t;document.getElementById('hint').textContent=t+' · toca el punto exacto del mapa'}map.on('click',e=>{if(!type)return;if(draft)map.removeLayer(draft);draft=L.marker(e.latlng,{icon:icon(),draggable:true}).addTo(map);openEdit(type,e.latlng);draft.on('dragend',x=>{const p=x.target.getLatLng();lat.value=p.lat.toFixed(6);lon.value=p.lng.toFixed(6)})});function openEdit(t,p){edit.style.display='block';kind.textContent=t;name.value=t;lat.value=p.lat.toFixed(6);lon.value=p.lng.toFixed(6)}function closeEdit(){edit.style.display='none';if(draft){map.removeLayer(draft);draft=null}}async function save(){const la=Number(lat.value.replace(',','.')),lo=Number(lon.value.replace(',','.'));if(!rid){alert('Selecciona una regata');return}if(!name.value||!Number.isFinite(la)||!Number.isFinite(lo)){alert('Nombre y coordenadas obligatorios');return}const body={name:name.value,type,lat:la,lon:lo};if(gps.value.trim())body.deviceId=gps.value.trim();const r=await fetch('/api/admin/regattas/'+encodeURIComponent(rid)+'/marks',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)});if(r.ok){type='';draft=null;edit.style.display='none';await load();hint.textContent='Boya guardada · selecciona otra'}else alert('Error '+r.status)}async function load(){marks.clearLayers();if(!rid)return;const a=await fetch('/api/regattas/'+encodeURIComponent(rid)+'/marks').then(r=>r.json());const pts=[];a.forEach(m=>{if(Number.isFinite(m.lat)&&Number.isFinite(m.lon)){const x=L.marker([m.lat,m.lon],{icon:icon(),draggable:false}).addTo(marks).bindTooltip(m.name+' · '+m.type,{permanent:true,direction:'right'});pts.push([m.lat,m.lon])}});if(pts.length){L.polyline(pts,{color:'#fff',weight:3,dashArray:'8 8'}).addTo(marks);map.fitBounds(pts,{padding:[60,60]})}}load();
</script></body></html>
