<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Montar campo · OptiLive</title><link rel="stylesheet" href="/vendor/leaflet/leaflet.css"><style>
html,body,#map{height:100%;margin:0;font-family:Arial}#map{background:#0b3851}.head{position:fixed;z-index:1000;left:12px;right:12px;top:12px;background:#fff;border-radius:16px;padding:12px;box-shadow:0 3px 12px #0005}.title{font-size:19px;font-weight:800;color:#07558a}.sub{font-size:13px;color:#5b6d7e;margin-top:4px}.panel{position:fixed;z-index:1000;left:12px;right:12px;bottom:12px;background:#fff;border-radius:16px;padding:12px;box-shadow:0 3px 14px #0007}.current{font-size:18px;font-weight:800;color:#102a43;margin-bottom:8px}.primary,.secondary,.done{width:100%;border:0;border-radius:11px;padding:13px;margin-top:7px;font-size:16px;font-weight:800}.primary{background:#087fe3;color:#fff}.secondary{background:#e9f3fb;color:#07558a}.done{background:#0b8f5a;color:#fff}.tools{display:flex;gap:7px}.tools button{flex:1;border:0;border-radius:9px;padding:9px;background:#eef2f5;color:#345;font-weight:700}.buoy{width:7px;height:7px;border-radius:50%;background:#ff4b3e;border:2px solid white;box-shadow:0 2px 4px #0008}.label{background:#07558ad9;color:#fff;border:1px solid #fff;border-radius:5px;padding:2px 5px;font-size:10px;font-weight:700}</style></head><body>
<div id="map"></div><div class="head"><div class="title">Montar campo · <span id="progress">0/7</span></div><div class="sub" id="regatta">Buscando regata activa…</div></div>
<div class="panel"><div class="current" id="current">Punto actual: SALIDA (S)</div><button class="primary" onclick="placeHere()">📍 COLOCAR AQUÍ (GPS)</button><button class="secondary" id="mapMode" onclick="armMap()">🗺 TOCAR MAPA</button><div class="tools"><button onclick="undo()">↶ Deshacer</button><button onclick="editCoords()">✏ Coordenadas</button></div><button class="done" onclick="finish()">✓ TERMINAR CAMPO</button></div>
<script src="/vendor/leaflet/leaflet.js"></script><script>
const q=new URLSearchParams(location.search);let rid=q.get('regatta')||'';const token=q.get('token')||'';
const seq=[['S','Salida'],['S','Salida'],['2','Boya 2'],['3','Boya 3'],['4','Boya 4'],['L','Llegada'],['L','Llegada']];
let step=0,data=[],armed=false,busy=false,line=null,selected=null;const layer=L.layerGroup();const map=L.map('map',{zoomControl:true}).setView([39.87,4.30],14);layer.addTo(map);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(map);
function icon(){return L.divIcon({className:'',html:'<div class="buoy"></div>',iconSize:[11,11],iconAnchor:[5,5]})}
async function init(){if(!rid){const rs=await fetch('/api/regattas').then(r=>r.json()).catch(()=>[]);if(rs.length)rid=rs[rs.length-1].id}if(!rid){regatta.textContent='No hay regatas creadas';current.textContent='Crea primero una regata';return}const rs=await fetch('/api/regattas').then(r=>r.json()).catch(()=>[]),r=rs.find(x=>x.id===rid);regatta.textContent=(r?r.name:'Regata')+' · ID '+rid;await load(true);step=Math.min(data.length,seq.length-1);ui()}
function ui(){progress.textContent=data.length+' puntos';current.textContent='Punto actual: '+(seq[step]?seq[step][1].toUpperCase():'AÑADIR PUNTO');mapMode.textContent=armed?'✓ TOCA AHORA EL MAPA':'🗺 TOCAR MAPA'}
function armMap(){armed=true;ui()}
map.on('click',e=>{if(armed){armed=false;savePoint(e.latlng.lat,e.latlng.lng)}});
function placeHere(){if(!navigator.geolocation){alert('GPS no disponible');return}current.textContent='Obteniendo GPS…';navigator.geolocation.getCurrentPosition(p=>savePoint(p.coords.latitude,p.coords.longitude),e=>{ui();alert('No se pudo obtener la posición GPS. Comprueba el permiso de ubicación.')},{enableHighAccuracy:true,timeout:12000,maximumAge:2000})}
async function savePoint(lat,lon){if(busy||!rid)return;busy=true;const x=seq[step]||seq[seq.length-1];current.textContent='Guardando '+x[0]+'…';const r=await fetch('/api/admin/regattas/'+encodeURIComponent(rid)+'/marks',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({name:x[0],type:x[1],lat,lon})});if(!r.ok){busy=false;ui();alert('No se pudo guardar ('+r.status+')');return}await load(false);step=Math.min(data.length,seq.length-1);busy=false;ui()}
async function load(fit){layer.clearLayers();if(line){map.removeLayer(line);line=null}data=await fetch('/api/regattas/'+encodeURIComponent(rid)+'/marks').then(r=>r.json()).catch(()=>[]);const pts=[];data.forEach(m=>{if(Number.isFinite(m.lat)&&Number.isFinite(m.lon)){const mk=L.marker([m.lat,m.lon],{icon:icon(),draggable:true}).addTo(layer).bindTooltip(m.name,{permanent:true,direction:'right',className:'label',offset:[5,0]});mk.on('click',()=>{selected=m;current.textContent='Seleccionada: '+m.name+' · arrástrala para moverla'});mk.on('dragstart',()=>{selected=m;current.textContent='Moviendo '+m.name+'…'});mk.on('dragend',e=>moveMark(m,e.target.getLatLng()));pts.push([m.lat,m.lon])}});if(pts.length>1)line=L.polyline(pts,{color:'#fff',weight:2,dashArray:'6 6'}).addTo(map);if(fit&&pts.length)map.setView(pts[pts.length-1],16)}
async function moveMark(m,ll){if(busy)return;busy=true;const r=await fetch('/api/admin/regattas/'+encodeURIComponent(rid)+'/marks/'+encodeURIComponent(m.deviceId),{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({lat:ll.lat,lon:ll.lng})});busy=false;if(!r.ok){alert('No se pudo mover la boya ('+r.status+')');await load(false);return}await load(false);current.textContent='Boya '+m.name+' movida ✓'}
function editCoords(){const la=prompt('Latitud para '+seq[step][0]);if(la===null)return;const lo=prompt('Longitud');if(lo===null)return;const a=Number(la.replace(',','.')),b=Number(lo.replace(',','.'));if(!Number.isFinite(a)||!Number.isFinite(b)){alert('Coordenadas no válidas');return}savePoint(a,b)}
function undo(){alert('Deshacer se activará en la siguiente mejora. Para evitar borrar una boya equivocada todavía no elimina datos.')}
function finish(){if(!data.length){alert('Todavía no has colocado ninguna boya');return}alert('Campo guardado con '+data.length+' puntos ✓')}
init();
</script></body></html>
